<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Starlight Cosmos Engine — cosmic content production pipeline">
  <title>Starlight Cosmos Engine</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0a0b"/>
      <stop offset="55%" stop-color="#0d1013"/>
      <stop offset="100%" stop-color="#0a0a0b"/>
    </linearGradient>
    <radialGradient id="nebula1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#06b6d4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="output" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="45%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <style>
      @media (prefers-reduced-motion: reduce) {
        .motion { animation: none !important; }
        animate, animateTransform { display: none; }
      }
      text { font-family: 'Segoe UI', ui-sans-serif, system-ui, -apple-system, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- nebula field (raw cosmic data source) -->
  <ellipse cx="150" cy="200" rx="170" ry="120" fill="url(#nebula1)"/>
  <ellipse cx="230" cy="150" rx="130" ry="90" fill="url(#nebula2)"/>

  <!-- starfield -->
  <g fill="#e2e8f0">
    <circle cx="60" cy="120" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="95" cy="215" r="1.3"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.6s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="90" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.8s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="185" cy="240" r="1.4"><animate attributeName="opacity" values="1;0.25;1" dur="3.1s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="245" cy="205" r="1.7"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.9s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="290" cy="110" r="1.3"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.5s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="180" r="1.2"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.7s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="175" r="1.5"><animate attributeName="opacity" values="1;0.3;1" dur="3.4s" begin="1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- flow line: raw data -> agent pipeline -> published output -->
  <path d="M 300 195 H 1000" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 9" opacity="0.6">
    <animate attributeName="stroke-dashoffset" values="0;-28" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <!-- orbital pipeline core (Hermes orchestration + agent stages) -->
  <g transform="translate(600,195)">
    <circle r="90" fill="none" stroke="#10b981" stroke-opacity="0.35" stroke-width="1"/>
    <circle r="62" fill="none" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1"/>
    <circle r="34" fill="none" stroke="#fbbf24" stroke-opacity="0.45" stroke-width="1"/>
    <circle r="40" fill="url(#core)">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="7" fill="#fef3c7"/>

    <g>
      <circle cx="90" cy="0" r="5" fill="#10b981"/>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="22s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="62" cy="0" r="4.2" fill="#06b6d4"/>
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="17s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="34" cy="0" r="3.4" fill="#fbbf24"/>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="11s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- published output pulse -->
  <g transform="translate(1030,195)">
    <circle r="70" fill="url(#output)"/>
    <rect x="-26" y="-19" width="52" height="38" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.4"/>
    <rect x="-18" y="-10" width="24" height="4" rx="2" fill="#10b981" opacity="0.85"/>
    <rect x="-18" y="-2" width="34" height="4" rx="2" fill="#06b6d4" opacity="0.7"/>
    <rect x="-18" y="6" width="16" height="4" rx="2" fill="#fbbf24" opacity="0.8"/>
    <circle r="26" fill="none" stroke="#10b981" stroke-width="1.2" opacity="0.5">
      <animate attributeName="r" values="26;50;26" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0;0.55" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- headline -->
  <text x="46" y="58" font-size="30" font-weight="700" letter-spacing="0.5" fill="url(#titleGrad)">STARLIGHT COSMOS ENGINE</text>
  <text x="48" y="84" font-size="14.5" fill="#94a3b8">Raw cosmic imagery &#8594; agent pipelines &#8594; published stories, orbit by orbit.</text>
</svg>
