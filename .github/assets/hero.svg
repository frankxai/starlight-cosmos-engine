<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
<defs>
  <radialGradient id="bg-sce" cx="50%" cy="40%" r="60%">
    <stop offset="0%" stop-color="#0d0a00"/>
    <stop offset="100%" stop-color="#0a0a0b"/>
  </radialGradient>
  <radialGradient id="star-glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#fbbf24"/>
    <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
  </radialGradient>
  <filter id="star-blur">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="planet-glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="1200" height="300" fill="url(#bg-sce)"/>

<!-- Background stars (twinkling) -->
<g fill="white">
  <circle cx="120" cy="30" r="1.5" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.9;0.4;0.8" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="280" cy="55" r="1" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.3;0.8;0.6" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="20" r="1.5" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.1;0.8;0.3;0.7" dur="4.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="35" r="1" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.9;0.2;0.7;0.5" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="25" r="1.5" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;1;0.5;0.8" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="50" r="1" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.9;0.1;0.7;0.6" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1150" cy="30" r="1.5" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.9;0.4;0.7" dur="3.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="200" r="1" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.2;0.6;0.4" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="180" r="1.5" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.8;0.3;0.5" dur="3.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="180" r="1" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.9;0.3;0.7;0.6" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="850" cy="170" r="1" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.8;0.2;0.6;0.5" dur="3.0s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- Central star glow -->
<circle cx="600" cy="110" r="45" fill="url(#star-glow)" opacity="0.6"/>

<!-- Central star (amber/gold) -->
<circle cx="600" cy="110" r="22" fill="#fbbf24" filter="url(#star-blur)">
  <animate attributeName="r" values="20;24;20" dur="2.5s" repeatCount="indefinite"/>
</circle>

<!-- Orbital ring 1 (inner, cyan) -->
<ellipse cx="600" cy="110" rx="80" ry="25" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.5"/>

<!-- Orbital ring 2 (middle) -->
<ellipse cx="600" cy="110" rx="130" ry="38" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.4"/>

<!-- Orbital ring 3 (outer) -->
<ellipse cx="600" cy="110" rx="185" ry="52" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.3"/>

<!-- Planet 1 - orbit ring 1 (small blue) -->
<g>
  <animateTransform attributeName="transform" type="rotate" from="0 600 110" to="360 600 110" dur="6s" repeatCount="indefinite"/>
  <circle cx="680" cy="110" r="8" fill="#06b6d4" filter="url(#planet-glow)" opacity="0.9"/>
</g>

<!-- Planet 2 - orbit ring 2 (medium emerald) -->
<g>
  <animateTransform attributeName="transform" type="rotate" from="120 600 110" to="480 600 110" dur="10s" repeatCount="indefinite"/>
  <circle cx="730" cy="110" r="10" fill="#10b981" filter="url(#planet-glow)" opacity="0.9"/>
</g>

<!-- Planet 3 - orbit ring 3 (larger amber) -->
<g>
  <animateTransform attributeName="transform" type="rotate" from="240 600 110" to="600 600 110" dur="16s" repeatCount="indefinite"/>
  <circle cx="785" cy="110" r="13" fill="#f59e0b" filter="url(#planet-glow)" opacity="0.85"/>
</g>

<!-- Title -->
<text x="600" y="233" fill="#fbbf24" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="30" font-weight="700" text-anchor="middle" letter-spacing="3">STARLIGHT COSMOS ENGINE</text>
<text x="600" y="258" fill="#94a3b8" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="13" text-anchor="middle">Real space science → cinematic content · Rights-gated · Human-approved</text>

<!-- Built on SIP -->
<text x="24" y="283" fill="#f59e0b" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11" opacity="0.8">Built on SIP</text>

<!-- Right accent -->
<line x1="900" y1="283" x2="1176" y2="283" stroke="#fbbf24" stroke-width="0.5" opacity="0.3"/>
</svg>